# Fast Zero-Shot FaceID + LCM-LoRA Configuration (<2s Training / 4-8 Step Inference)
inference:
  engine_mode: "instant_faceid"
  base_model: "dreamlike-art/dreamlike-diffusion-1.0"
  vae_model: null
  face_id_path: "checkpoints/person_face_id.safetensors"
  ip_adapter_repo: "h94/IP-Adapter-FaceID"
  ip_adapter_weight_name: "ip-adapter-faceid_sd15.bin"
  ip_adapter_scale: 0.7
  use_lcm: true
  lcm_lora_repo: "latent-consistency/lcm-lora-sdv1-5"

  prompt: "a portrait photo of a person in a sharp navy suit, studio lighting, 85mm lens"
  negative_prompt: "monochrome, lowres, bad anatomy, worst quality, low quality, blurry, distorted face"
  style_preset: "photorealistic"
  trigger_word: "sks person"
  auto_inject_trigger: false

  width: 512
  height: 512
  num_inference_steps: 6
  guidance_scale: 1.5
  seed: 42
  num_images_per_prompt: 1
  sampler: "lcm"

  mixed_precision: "fp32"
  enable_cpu_offload: false
  enable_vae_tiling: false
  enable_vae_slicing: true

  output_dir: "outputs/generated"
  save_format: "PNG"
  embed_metadata: true
