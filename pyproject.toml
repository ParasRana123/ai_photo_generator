[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_photo_generator"
version = "0.1.0"
description = "Personal AI Photo Generator - Phase 1: SDXL LoRA Training Pipeline"
readme = "plan.md"
requires-python = ">=3.10"
authors = [
    { name = "Paras Rana", email = "parasrana579@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0.0",
    "diffusers>=0.28.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "safetensors>=0.4.3",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
